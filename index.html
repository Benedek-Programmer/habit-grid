<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HabitGrid</title>
</head>

<body>
    <header class="app-header">
        <div>
            <h1>HabitGrid</h1>
            <p class="subtitle">Click any square to log progress and build your streak.</p>
        </div>
        <div class="header-right">
            <div class="legend" aria-label="Activity intensity legend">
                <span>Less</span>
                <span class="cell" data-level="0"></span>
                <span class="cell" data-level="1"></span>
                <span class="cell" data-level="2"></span>
                <span class="cell" data-level="3"></span>
                <span class="cell" data-level="4"></span>
                <span>More</span>
            </div>

            <div class="backup-controls">
                <button type="button" id="export-btn" class="btn-small">Export</button>
                <button type="button" id="import-btn" class="btn-small">Import</button>
                <input type="file" id="improt-file" accept=".json" style="display: none;">
            </div>

            <a href="https://github.com/Benedek-Programmer/habit-grid" target="_blank" rel="noopener noreferrer"
                class="github-link" title="View source on GitHub" aria-label="View source on GitHub">
                <svg height="24" width="24" viewbox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                </svg>
            </a>
        </div>
    </header>

    <main>
        <form id="habit-form" class="habit-form">
            <input id="habit-input" type="text" placeholder="New habit (e.g., Read 20 pages, Go to Training, etc.)"
                maxlength="60" required>

            <div class="theme-picker" id="theme-picker" role="radiogroup" aria-label="Habit Color Theme">
                <button type="button" class="swatch active" data-theme="green" title="Emerald Green"
                    aria-label="Emerald Green"></button>
                <button type="button" class="swatch" data-theme="blue" title="Ocean Blue"
                    aria-label="Ocean Blue"></button>
                <button type="button" class="swatch" data-theme="purple" title="Royal Purple"
                    aria-label="Royal Purple"></button>
                <button type="button" class="swatch" data-theme="orange" title="Sunset Orange"
                    aria-label="Sunset Orange"></button>
                <button type="button" class="swatch" data-theme="pink" title="Rose Pink"
                    aria-label="Rose Pink"></button>
            </div>

            <button type="submit" class="btn-primary">Add Habit</button>
            <button type="button" id="delete-all-btn" class="btn-danger">Delete All Habits</button>
        </form>

        <section id="habits-container" class="habits-container"></section>
    </main>

    <script src="script.js"></script>
</body>

</html>
